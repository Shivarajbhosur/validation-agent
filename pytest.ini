[pytest]
# Regression suite configuration for the Validation Agent.
# Scoped to the tests/ directory so it never interferes with the app.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    regression: end-to-end regression cases driven by JSON datasets
    rag: knowledge-base retrieval (RAG) tests using an isolated Chroma store
    flow: agent-sequence / flow-control tests
    e2e: real end-to-end runs requiring pwsh/.NET/Beyond Compare (not run in CI)

addopts =
    -ra
    --strict-markers
