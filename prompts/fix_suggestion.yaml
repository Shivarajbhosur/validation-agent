# PROMPT: Retry After Failed Fix
# ============================================================================
retry_analysis:
  description: "Re-analyze after a failed fix attempt"
  template: |
    ## Task
    The previous fix attempt did not resolve the issue. Analyze the new error and suggest a different fix.

    ## Current Attempt
    **Attempt Number:** {attempt_number} of {max_attempts}
    **Program Name:** {program_name}
    **Baseline:** {baseline_name}

    ## Previous Failed Attempts
    {previous_attempts_details}

    ## Current Error
    **Error Message:**
    ```
    {error_message}
    ```

    {stack_trace_section}

    ## COBOL Source Code (Source of Truth)
    **File:** {cobol_file_path}
    ```cobol
    {cobol_code}
    ```

    ## C# Code (Current State After Previous Fixes)
    **File:** {csharp_file_path}
    ```csharp
    {csharp_code}
    ```

    {subroutine_sources_section}

    {project_types_section}

    {experlib_section}

    {baseline_files_section}

    {issues_section}

    {similar_fixes_section}

    ## Instructions
    1. Review what was tried before and why it failed
    2. Analyze the NEW error message - is it the same issue or a different one?
    3. If same issue: try a DIFFERENT approach
    4. If new issue: the previous fix may have worked partially, now fix the new issue
    5. Consider if multiple changes are needed together
    6. Be more thorough - check edge cases, null conditions, data types

    ## EMPTY / MISSING OUTPUT FILE → FILE-READ BUFFER MUST BE `Record`, NOT `String`
    If the output file is EMPTY or nearly every expected record is missing
    even though the program ran, check EVERY field passed to a `*.Read(...)`
    call. `Read()` fills a `Record` BY REFERENCE; a field declared as
    `String` (`private String wsFixinRec = "";`) stays empty, so all
    downstream `Subfield(...)` / `CharAt(...)` work on empty data and the
    output file is empty. Fix has TWO required parts (declaration alone will
    not compile):
      1. `private String wsFixinRec = "";` → `private Record wsFixinRec = new Record();`
      2. `wsFixinRec = "";` → `wsFixinRec.Value = "";`
    Leave `Subfield/CharAt/Display/Read(wsFixinRec)` call sites unchanged.

    ## DISPLAY NUMERIC COUNTER MUST BE ZERO-PADDED WITH `Format(...)`
    If a SYSOUT/report line prints a numeric counter UNPADDED (e.g. `= 10`)
    but the baseline shows it ZERO-PADDED (e.g. `= 00010`), wrap ONLY that
    numeric variable in the `Display(...)` concatenation with
    `Format(<var>, "<N zeros>")`, where N = the digit width of the expected
    baseline value (`00010` → 5 → `"00000"`). Example:
      `Display("... = " + antIn);` → `Display("... = " + Format(antIn, "00000"));`
    Change ONLY the affected `Display(...)` line(s) — one Original/Suggested
    pair each; do NOT touch the variable's declaration or increments.

    ## MULTIPLE-EDIT FIXES (one fix that needs several separate changes)
    If the correct fix requires more than one SEPARATE, non-adjacent edit in
    the same file (e.g. the `String`→`Record` declaration + reset above),
    output one `### Original Code` / `### Suggested Fix` pair FOR EACH edit,
    in order, repeating those two headers. Do NOT merge non-adjacent lines
    into a single block.

    ## CRITICAL RULES - MUST FOLLOW
    - **DO NOT add extra null checks, if conditions, or defensive coding**
    - **C# code must MIRROR the COBOL logic exactly - nothing more, nothing less**
    - **COBOL is the source of truth - if COBOL doesn't check for null, C# shouldn't either**
    - **Look for TEST BUG comments, obvious mistakes, or code that doesn't match COBOL**
    - **If C# has extra/wrong code, suggest REMOVING it and using the COBOL equivalent**
    - **The fix should make C# behave EXACTLY like COBOL, not "safer"**
    - **Original code should show the ACTUAL buggy code from the C# file**
    - **Suggested fix should show what COBOL does - simple, direct translation**
    - **DO NOT INVENT CODE - only suggest code that exists in COBOL**
    - **DO NOT add default values, initializations, or fields that COBOL doesn't set**
    - **If COBOL only sets 3 fields, C# should only set 3 fields - NOT MORE**
    - **Check COBOL line by line - C# must have exact same number of operations**

    ## Required Output Format
    Provide your response in this exact format:

    ### What Changed
    [Explain if this is the same error or a new error after the previous fix]

    ### Root Cause
    [One sentence explaining the current error]

    ### Analysis
    [Detailed analysis, noting what was tried before and why this approach is different]

    ### File to Fix
    [Exact path of the C# file shown under "## C# Code (Current State After
    Previous Fixes)" above — copy its **File:** path verbatim; do NOT invent
    a different folder or name a DIFFERENT program's file unless a named
    subroutine is clearly implicated.]

    ### Line Number
    [Line number if identifiable, or "N/A"]

    ### Original Code
    ```csharp
    [Current code that is wrong]
    ```

    ### Suggested Fix
    ```csharp
    [Corrected code - try a DIFFERENT approach than before]
    ```

    ### Confidence
    [0-100]%

    ### Fix Type
    [Category]

    ### Why This Is Different
    [Explain why this fix will work when the previous one didn't]

    ### Justification
    [Reference to COBOL source]

    ### Verification
    [How to test]

    ### Notes
    [Additional considerations]

# ============================================================================
# SECTION TEMPLATES
# ============================================================================
sections:
  stack_trace:
    condition: "stack_trace is not None"
    template: |
      **Stack Trace:**
      ```
      {stack_trace}
      ```

  csharp_record:
    condition: "csharp_record_code is not None"
    template: |
      ## C# Record/Model File
      **File:** {csharp_record_path}
      ```csharp
      {csharp_record_code}
      ```

  similar_fixes:
    condition: "similar_fixes is not empty"
    template: |
      ## Similar Past Fixes (From Knowledge Base)
      The following similar issues were fixed before. Use these as reference:

      {similar_fixes_list}

  previous_attempts:
    condition: "attempt_number > 1"
    template: |
      ## Previous Fix Attempts (Did Not Work)
      The following fixes were already tried but did not resolve the issue:

      {previous_attempts_list}

# ============================================================================
# OUTPUT PARSING
# ============================================================================
output_parsing:
  fields:
    - name: "root_cause"
      pattern: "### Root Cause\\n(.+?)\\n\\n"
      required: true

    - name: "explanation"
      pattern: "### Analysis\\n(.+?)\\n\\n### File"
      required: true

    - name: "file_to_fix"
      pattern: "### File to Fix\\n(.+?)\\n"
      required: true

    - name: "line_number"
      pattern: "### Line Number\\n(.+?)\\n"
      required: false
      type: "int"

    - name: "original_code"
      pattern: "### Original Code\\n```csharp\\n(.+?)\\n```"
      required: true

    - name: "suggested_code"
      pattern: "### Suggested Fix\\n```csharp\\n(.+?)\\n```"
      required: true

    - name: "confidence"
      pattern: "### Confidence\\n(\\d+)%"
      required: true
      type: "int"

    - name: "fix_type"
      pattern: "### Fix Type\\n(.+?)\\n"
      required: false

    - name: "additional_notes"
      pattern: "### Notes\\n(.+?)$"
      required: false

# ============================================================================
# FALLBACK PROMPTS
# ============================================================================
fallback:
  no_cobol:
    template: |
      ## Warning
      COBOL source code is not available for program {program_name}.

      Without COBOL source, I cannot verify if the C# code matches the original behavior.

      **Recommendation:** Locate the COBOL source file ({program_name}.COB) and retry analysis.

      **Confidence:** Below 50% for any fix suggestion without COBOL reference.

  no_csharp:
    template: |
      ## Warning
      C# code is not available for program {program_name}.

      Cannot suggest a fix without seeing the current C# implementation.

      **Recommendation:** Ensure the C# file exists at the expected location.

  no_error:
    template: |
      ## Warning
      No error message or diff details provided.

      Please provide:
      - The error message (for runtime errors)
      - The diff output (for comparison failures)

      Without this information, I cannot analyze the issue.
