name: Regression Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Agent regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt -r requirements-dev.txt

      - name: Run regression suite
        run: |
          python -m pytest tests/regression \
            -m regression \
            --html=tests/regression/report/pytest_report.html --self-contained-html \
            -v

      - name: Upload regression HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: tests/regression/report/
          if-no-files-found: warn
          retention-days: 30
